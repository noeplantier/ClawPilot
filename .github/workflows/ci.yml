name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      - run: black --check --line-length 120 --extend-exclude "alembic/versions" .
        working-directory: backend
      - run: isort --check-only .
        working-directory: backend
      - run: flake8 .
        working-directory: backend
      - name: mypy (informational — pre-existing AI-route code isn't fully typed yet)
        run: mypy --ignore-missing-imports db/ repositories/ routes/ services/ scripts/ deps.py models.py
        working-directory: backend
        continue-on-error: true

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
          package-manager-cache: false
      - run: npm ci --legacy-peer-deps
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - name: frontend tests with report
        run: |
          mkdir -p reports
          npm test -- --watchAll=false --ci --json --outputFile=reports/jest-results.json
        working-directory: frontend
        env:
          CI: "true"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: frontend-test-report
          path: frontend/reports/jest-results.json
          if-no-files-found: ignore
          retention-days: 7

  alembic-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: clawpilot_ci
          POSTGRES_USER: clawpilot
          POSTGRES_PASSWORD: ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clawpilot"
          --health-interval 5s --health-timeout 3s --health-retries 5
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: backend
      - name: alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://clawpilot:ci-password@localhost:5432/clawpilot_ci
        run: alembic upgrade head
      - name: alembic check (no model/migration drift)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://clawpilot:ci-password@localhost:5432/clawpilot_ci
        run: alembic check

  test-backend:
    runs-on: ubuntu-latest
    needs: [lint-backend, alembic-check]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: clawpilot_ci
          POSTGRES_USER: clawpilot
          POSTGRES_PASSWORD: ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clawpilot"
          --health-interval 5s --health-timeout 3s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://clawpilot:ci-password@localhost:5432/clawpilot_ci
      JWT_SECRET: ci-only-secret-not-used-in-prod-32b
      CORS_ORIGINS: "http://localhost:3000"
      PUBLIC_BASE_URL: http://localhost:8000
      OUTREACH_SENDER_NAME: CI Sender
      OUTREACH_SENDER_COMPANY: CI Company SAS
      OUTREACH_SENDER_ADDRESS: 1 rue Fictive, 69000 Lyon
      OUTREACH_SENDER_EMAIL: ci-sender@example.com
      OUTREACH_SENDER_WHATSAPP: "+33 6 00 00 00 02" # fictional: printed in the footer of every e-mail
      # Tests only: record sends in-process instead of calling a provider, and offer the demo directory. Never in production.
      OUTREACH_TEST_SINK: "true"
      FEATURE_DEMO_DATA: "true"
      OUTREACH_LIVE_PHONES: "+33600000001" # a fictional number: the WhatsApp test route only reaches listed numbers
      # The suite registers one organisation per test (about 300 now): the sign-up limit (300 an hour, in memory) stays on in production.
      REGISTER_MAX_PER_HOUR: "2000"
      REACT_APP_BACKEND_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      - run: alembic upgrade head
        working-directory: backend
      - name: Start API server in background
        working-directory: backend
        run: |
          nohup uvicorn server:app --host 0.0.0.0 --port 8000 > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/health && exit 0
            sleep 1
          done
          echo "Server failed to become healthy" && cat server.log && exit 1
      - name: Run backend test suite with report
        working-directory: backend
        run: |
          mkdir -p reports
          pytest tests/ -v --junitxml=reports/junit.xml
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: backend-test-report
          path: backend/reports/junit.xml
          if-no-files-found: ignore
          retention-days: 7

  build-frontend:
    runs-on: ubuntu-latest
    needs: [lint-frontend]
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
          package-manager-cache: false
      - run: npm ci --legacy-peer-deps
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: frontend-build
          path: frontend/build
          retention-days: 7

  e2e:
    # The complete journey through the real UI, against the real API and PostgreSQL. Dry-run, no provider key, no outbound call.
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: clawpilot_ci
          POSTGRES_USER: clawpilot
          POSTGRES_PASSWORD: ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clawpilot"
          --health-interval 5s --health-timeout 3s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://clawpilot:ci-password@localhost:5432/clawpilot_ci
      JWT_SECRET: ci-only-secret-not-used-in-prod-32b
      CORS_ORIGINS: "http://localhost:3000"
      PUBLIC_BASE_URL: http://localhost:8000
      OUTREACH_SENDER_NAME: CI Sender
      OUTREACH_SENDER_COMPANY: CI Company SAS
      OUTREACH_SENDER_ADDRESS: 1 rue Fictive, 69000 Lyon
      OUTREACH_SENDER_EMAIL: ci-sender@example.com
      OUTREACH_SENDER_WHATSAPP: "+33 6 00 00 00 02" # fictional: printed in the footer of every e-mail
      # Tests only: record sends in-process instead of calling a provider, and offer the demo directory. Never in production.
      OUTREACH_TEST_SINK: "true"
      FEATURE_DEMO_DATA: "true"
      OUTREACH_LIVE_PHONES: "+33600000001" # a fictional number: the WhatsApp test route only reaches listed numbers
      REACT_APP_BACKEND_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      - run: alembic upgrade head
        working-directory: backend
      - name: Start API server in background
        working-directory: backend
        run: |
          nohup uvicorn server:app --host 0.0.0.0 --port 8000 > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/health && exit 0
            sleep 1
          done
          echo "Server failed to become healthy" && cat server.log && exit 1
      - name: Start real Celery automation worker
        working-directory: backend
        run: |
          nohup celery -A celery_app worker -Q automation -l warning >/dev/null 2>&1 &
          for i in $(seq 1 20); do
            if celery -A celery_app inspect ping --timeout=1 >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          echo "Celery automation worker failed to become ready" && exit 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
          package-manager-cache: false
      - run: npm ci --legacy-peer-deps
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results
          retention-days: 7

  deploy-render:
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render deploy hook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret not set — skipping deploy trigger." && exit 0
          fi
          curl -f "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
