[build]
  base = "frontend"
  publish = "dist"      # set to your actual publish folder (e.g. build, dist, public)
  command = "npm run build"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"

[context.production]
  command = "npm run build:prod"

[context.staging]
  command = "npm run build:staging"
