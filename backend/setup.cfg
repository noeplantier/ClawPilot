[flake8]
max-line-length = 120
extend-ignore = E203, W503, E402
exclude = .venv,venv,__pycache__,alembic/versions
# Pre-existing integration test style nits (ambiguous `l` var, `== True/False`,
# long literal payload lines) — not touching test logic to satisfy the linter.
per-file-ignores =
    tests/test_openclaw_api.py:E741,E712,E501,F401
    tests/test_iteration2_features.py:E741,E712,E501,F541

[isort]
profile = black
line_length = 120
skip = .venv,venv,__pycache__,alembic/versions
