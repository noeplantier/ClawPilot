# Netlify build for the React frontend (the API is deployed separately, see render.yaml).
# This file must live at the repository root; Netlify ignores one under frontend/public/.
# In the Netlify UI, "Base directory" must be empty or "frontend" — not "public".
[build]
  # PAUSED (decision of the owner, to save Netlify build credits): every build is skipped — production and deploy previews.
  # The site already online stays as it is. To deploy again, delete the `ignore` line below.
  ignore = "exit 0"
  base = "frontend"
  command = "npm ci --legacy-peer-deps && npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "20"
  CI = "false" # CRA turns lint warnings into build errors when CI=true; 21 warnings pre-exist

# Free Overpass relay (frontend/netlify/functions/overpass.mjs): same origin for the browser, another address for the public servers.
[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/relay/overpass"
  to = "/.netlify/functions/overpass"
  status = 200
  force = true

# SPA fallback: react-router handles every path client-side.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000"

# Build output under /static has a content hash in its name: cache it for a year, never revalidate.
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
